version: '3.8'
services:

  backend-app:
    build: .
    ports:
      - "8080:8080"
    environment:
     - SPRING_DATASOURCE_URL=jdbc:postgresql://banco:5432/${POSTGRES_DB}
     - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
     - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}

     - SPRING_MAIL_USERNAME=${MAIL_USERNAME}
     - SPRING_MAIL_PASSWORD=${MAIL_PASSWORD}

     - API_SECURITY_TOKEN_SECRET=${API_SECRET}

     - SPRING_DATA_REDIS_HOST=redis-dev
     - SPRING_DATA_REDIS_PORT=6379
    depends_on:
      - banco
      - redis-dev

  redis-dev:
    image: redis:7.4.8-alpine
    container_name: redis-confeitaria
    ports:
      - "6379:6379"

  banco:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
volumes:
  dados-postgres:
